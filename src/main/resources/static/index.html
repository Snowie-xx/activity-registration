<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>限量活动报名系统</title>
<style>
  :root { --border:#e2e8f0; --accent:#2563eb; --ok:#16a34a; --err:#dc2626; --warn:#d97706; --bg:#f8fafc; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: #1e293b; margin: 0; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #64748b; font-size: 13px; margin-bottom: 20px; }
  .panel { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .panel h2 { font-size: 15px; margin: 0 0 12px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  input[type=text], input[type=number] { padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
  button { padding: 8px 14px; border: 1px solid var(--border); border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.danger { background: var(--err); color: #fff; border-color: var(--err); }
  button.mini { padding: 2px 8px; font-size: 12px; margin-right: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: #64748b; font-weight: 600; }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 12px; }
  .badge.open { background: #dcfce7; color: var(--ok); }
  .badge.closed { background: #fee2e2; color: var(--err); }
  .remaining-zero { color: #94a3b8; }
  .muted { color: #94a3b8; font-size: 12px; }
  .hint { font-size: 12px; }
  .hint.err { color: var(--err); }
  .hint.ok { color: var(--ok); }
  .hint.info { color: #1d4ed8; }
  .act-result { font-size: 12px; min-width: 200px; color: #64748b; }
  .act-result.ok { color: var(--ok); font-weight: 600; }
  .act-result.warn { color: var(--warn); font-weight: 600; }
  .act-result.err { color: var(--err); font-weight: 600; }
  .act-result.info { color: #1d4ed8; }
</style>
</head>
<body>
  <h1>限量活动报名系统</h1>
  <div class="sub">真实调用后端：报名/查询结果就地显示在对应位置，无需滚动到页面底部。</div>

  <div class="panel">
    <h2>演示身份</h2>
    <div class="row">
      <label for="userId">用户 ID（X-User-Id，正整数）</label>
      <input type="text" id="userId" value="1101" placeholder="例如 1101" oninput="onUserChange()">
      <button class="primary" onclick="refreshAll()">加载 / 刷新</button>
      <span id="uidHint" class="hint muted">登录系统不在本次范围，仅用于演示数据隔离</span>
    </div>
  </div>

  <div class="panel">
    <h2>活动列表 <span class="muted">（点标题看详情；点「报名」结果直接显示在行内「结果」列）</span></h2>
    <table>
      <thead><tr><th>ID</th><th>标题</th><th>状态</th><th>总名额</th><th>剩余名额</th><th>操作</th><th>结果</th></tr></thead>
      <tbody id="activityBody"><tr><td colspan="7" class="muted">加载中…</td></tr></tbody>
    </table>
  </div>

  <div class="panel">
    <h2>我的报名</h2>
    <div class="row">
      <button class="primary" onclick="loadMyRegistrations()">查询我的报名</button>
      <span id="regHint" class="hint muted">仅返回当前 X-User-Id 的报名，按创建时间降序</span>
    </div>
    <table>
      <thead><tr><th>报名ID</th><th>活动ID</th><th>requestId</th><th>状态</th><th>时间</th></tr></thead>
      <tbody id="regBody"><tr><td colspan="5" class="muted">尚未查询</td></tr></tbody>
    </table>
  </div>

<script>
const API = '/api';
let userId = () => document.getElementById('userId').value.trim();
// 保存「最后一次网络失败」的报名意图，用于保留原 requestId 重试
let retryIntent = null;
// 每个活动行的行内结果缓存，页面刷新表格后仍能还原
const rowResults = {};

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// —— 就地提示：用户 ID 输入框旁 / 报名查询按钮旁 / 活动行内 ——
function setUidHint(msg, kind) {
  const el = document.getElementById('uidHint');
  el.textContent = msg;
  el.className = 'hint ' + (kind || 'muted');
}
// 切换用户（用户 ID 变化）时：清空上一用户的报名列表与行内结果，避免残留
function onUserChange() {
  for (const k in rowResults) delete rowResults[k];
  document.querySelectorAll('.act-result').forEach(c => { c.innerHTML = ''; c.className = 'act-result'; });
  const reg = document.getElementById('regBody');
  reg.innerHTML = `<tr><td colspan="5" class="muted">尚未查询</td></tr>`;
  setRegHint('仅返回当前 X-User-Id 的报名，按创建时间降序', 'muted');
  setUidHint('', '');
}

function setRegHint(msg, kind) {
  const el = document.getElementById('regHint');
  el.textContent = msg;
  el.className = 'hint ' + (kind || 'muted');
}

function setRowResult(activityId, html, kind) {
  rowResults[activityId] = { html, kind };
  const cell = document.getElementById('res_' + activityId);
  if (cell) { cell.innerHTML = html; cell.className = 'act-result ' + (kind || ''); }
}

function validUid() {
  const uid = userId();
  if (!/^[1-9]\d*$/.test(uid)) {
    setUidHint('请输入正整数用户 ID（例如 1101）', 'err');
    return null;
  }
  setUidHint('', '');
  return uid;
}

async function http(method, path, body, headers) {
  const opts = { method, headers: { ...(headers || {}) } };
  if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(API + path, opts);
  let data = null;
  try { data = await res.json(); } catch (e) { /* 非 JSON 响应 */ }
  return { status: res.status, data };
}

function activityRow(a) {
  const open = a.status === 'OPEN';
  const badge = `<span class="badge ${open ? 'open' : 'closed'}">${esc(a.status)}</span>`;
  const rem = a.remainingQuota <= 0 ? `<span class="remaining-zero">${a.remainingQuota}</span>` : a.remainingQuota;
  const disabled = !open || a.remainingQuota <= 0;
  const r = rowResults[a.id];
  const resultCell = r
    ? `<td class="act-result ${r.kind}" id="res_${a.id}">${r.html}</td>`
    : `<td class="act-result" id="res_${a.id}"></td>`;
  return `<tr>
    <td>${a.id}</td>
    <td><a href="javascript:void(0)" onclick="viewDetail(${a.id})">${esc(a.title)}</a></td>
    <td>${badge}</td>
    <td>${a.totalQuota}</td>
    <td>${rem}</td>
    <td><button onclick="register(${a.id})" ${disabled ? 'disabled' : ''}>报名</button></td>
    ${resultCell}
  </tr>`;
}

async function loadActivities() {
  const { status, data } = await http('GET', '/activities?page=1&size=100');
  const body = document.getElementById('activityBody');
  if (status !== 200 || !data || !data.data) { body.innerHTML = `<tr><td colspan="7" class="muted">加载失败</td></tr>`; return; }
  const items = data.data.items || [];
  body.innerHTML = items.length ? items.map(activityRow).join('') : `<tr><td colspan="7" class="muted">暂无活动</td></tr>`;
}

async function viewDetail(id) {
  const { status, data } = await http('GET', '/activities/' + id);
  if (status === 200 && data && data.data) {
    const a = data.data;
    setRowResult(id, `详情：${esc(a.title)} / ${esc(a.status)} / 剩余 ${a.remainingQuota}/${a.totalQuota}`, 'info');
  } else {
    setRowResult(id, `查看失败（HTTP ${status}）`, 'err');
  }
}

async function register(activityId) {
  const uid = validUid();
  if (!uid) return;

  // 新报名意图 → 生成新键；网络失败重试才复用旧键
  const requestId = 'req_' + activityId + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  await doRegister({ userId: uid, activityId, requestId });
}

async function doRegister(intent) {
  setRowResult(intent.activityId, '报名中…', 'info');
  try {
    const { status, data } = await http('POST', '/registrations', { activityId: intent.activityId, requestId: intent.requestId }, { 'X-User-Id': intent.userId });
    retryIntent = null; // 已得到响应，本次意图结束
    if (status === 201) {
      setRowResult(intent.activityId, '✓ 报名成功', 'ok');
    } else if (status === 200) {
      setRowResult(intent.activityId, '✓ 报名成功（重放）', 'ok');
    } else {
      const code = data?.code || '';
      const text = code === 'ALREADY_REGISTERED' ? '已报名'
                 : code === 'SOLD_OUT' ? '已满'
                 : code === 'ACTIVITY_CLOSED' ? '已关闭'
                 : code === 'IDEMPOTENCY_CONFLICT' ? '请求键冲突'
                 : (data?.message || ('业务失败 ' + code));
      setRowResult(intent.activityId, esc(text), 'warn');
    }
    loadActivities();
    loadMyRegistrations();
  } catch (e) {
    // 网络失败：保留原 requestId，就地提供「重试」复用同一键
    retryIntent = intent;
    setRowResult(intent.activityId,
      `网络失败 <button class="mini danger" onclick="doRegister(retryIntent)">重试</button><button class="mini" onclick="retryIntent=null;setRowResult(${intent.activityId},'','')">放弃</button>`,
      'err');
  }
}

async function loadMyRegistrations() {
  const uid = validUid();
  if (!uid) { setRegHint('请先输入有效的用户 ID', 'err'); return; }
  setRegHint('查询中…', 'info');
  const { status, data } = await http('GET', '/registrations?page=1&size=100', undefined, { 'X-User-Id': uid });
  const body = document.getElementById('regBody');
  if (status !== 200 || !data || !data.data) {
    body.innerHTML = `<tr><td colspan="5" class="muted">查询失败（HTTP ${status}）</td></tr>`;
    setRegHint('查询失败', 'err');
    return;
  }
  const items = data.data.items || [];
  body.innerHTML = items.length
    ? items.map(r => `<tr><td>${esc(r.id)}</td><td>${r.activityId}</td><td>${esc(r.requestId)}</td><td>${esc(r.status)}</td><td>${esc(r.createdAt)}</td></tr>`).join('')
    : `<tr><td colspan="5" class="muted">该用户暂无报名记录</td></tr>`;
  setRegHint(`共 ${items.length} 条`, 'ok');
}

function refreshAll() {
  loadActivities();
  const uid = validUid();
  if (uid) loadMyRegistrations();
}

// 初始加载
loadActivities();
</script>
</body>
</html>
